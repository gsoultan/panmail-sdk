name: CodeQL

# A standing check rather than a one-off audit. The interesting findings in
# this repository so far — an api key following a redirect, a header value
# ending its own line — were found by reading the code and probing it, and the
# next one will be too. This catches the ones nobody thought to look for.
#
# PHP is absent because CodeQL does not analyse it. That is the language whose
# only injectable bug so far was real, so PHPStan at max on src is doing that
# job instead; see php/phpstan.neon.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A new query pack can find something in code that has not changed.
    - cron: '27 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required for the action to read workflow run status on private repos.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            # Not autobuild: the pom is in java/, not at the root, and a build
            # mode that guesses is one that can quietly analyse nothing.
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Between init and analyze, which is where a manual build has to happen.
      - name: Build the Java client
        if: matrix.language == 'java-kotlin'
        run: mvn --batch-mode -DskipTests package
        working-directory: java

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
