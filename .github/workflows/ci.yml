name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository. A job that needs more
# asks for it itself.
permissions:
  contents: read

# A new push to the same ref makes the run in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what go.mod declares, and `stable` is whatever is current.
        # Testing only the latest lets a newer stdlib call in without anyone
        # noticing it broke the floor; testing only the floor lets a future
        # release break the build with nobody watching.
        go: ['1.27', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      # A floor rather than a target. It sits under where the suite is so an
      # honest refactor does not trip it, and above where a whole untested
      # feature would put it. It was 88.5% before anyone looked, with Unwrap
      # on every error type and both of WithHTTPClient and WithTimeout at zero.
      - name: Coverage floor
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')"
          echo "coverage: $total%"
          if ! awk -v t="$total" 'BEGIN { exit (t + 0 >= 95) ? 0 : 1 }'; then
            echo "::error::coverage is $total%, below the 95% floor"
            exit 1
          fi

  # Not in the matrix above: the linter reads the source, not the toolchain, so
  # running it once per Go version would say the same thing twice.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new release cannot turn main red on a rule nobody
          # chose. Dependabot proposes the bump; CI proves it on the PR.
          version: v2.13.2

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json declares >=8.1 with no ceiling, so the newest release
        # is part of that promise too.
        php: ['8.1', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          # Go and Java gate coverage with their own toolchains; PHP needs a
          # driver to produce a number at all.
          coverage: xdebug
      # The published package is defined at the repository root, because that
      # is the only composer.json Packagist reads. PackageDefinitionTest keeps
      # the two from drifting; this checks the published one is well formed.
      - run: composer validate --strict --no-check-lock --no-check-publish
        working-directory: .
      - run: composer validate --strict --no-check-lock --no-check-publish
      - run: composer install --prefer-dist --no-progress
      - run: composer test
      # PHPStan at max on src. It is the only thing standing between a mixed
      # from a decoded JSON body and an "Array to string conversion" in front
      # of a caller, which is exactly the bug it found in classify().
      - run: composer analyse
      # A floor, not a target. The two statements it does not reach are a
      # private constructor that exists to stop instantiation, and curl_init
      # returning false.
      - run: composer coverage
      - run: python3 ../scripts/coverage-floor.py coverage.xml 95

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # The published protos are copies, and this only checks they are still
      # valid and self-consistent. Whether they still *match* the gateway's is
      # checked by the proto-drift workflow, not here.
      #
      # Behaviour is a different question, and the answer is in the panmail
      # repo: internal/sdkcontract sends through the real auth stack with this
      # client and runs in its ordinary CI pass. It guards the *published* SDK
      # though — whatever version is in the gateway's go.mod — so main is only
      # covered once it is tagged.
      #
      # It also covers Go only. PHP builds the same wire body by hand, and
      # nothing automated compares it to anything. That is the gap that is
      # left. See docs/WIRE.md.
      - run: buf lint proto
