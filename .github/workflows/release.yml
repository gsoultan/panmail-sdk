name: Release

# One tag releases all three packages, because they share a version number.
# Go needs nothing here — the module proxy serves whatever the tag points at —
# and PHP is served by Packagist from the repository itself. Only npm needs
# something pushed to it.
#
# The same workflow runs as a dry run from the Actions tab. Deliberately the
# same one: a separate dry-run workflow is a copy, and a copy drifts until it
# is testing something the real release no longer does. Here the only
# difference is the last step of each job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check everything, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # A tag that disagrees with the manifest would publish a version nobody can
  # trace back. Cheaper to find out here than after it is on a registry, where
  # a version number cannot be reused.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          node_version="$(node -p 'require("./node/package.json").version')"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            # A dry run has no tag to check against. node/package.json is the
            # only manifest carrying a version now, so there is nothing to
            # cross-check it with and nothing to fail on.
            echo "dry run at $node_version"
            echo "version=$node_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version; checking the manifest agrees with the tag"

          if [ "$node_version" != "$version" ]; then
            echo "::error::node/package.json is $node_version, tag is $version"
            exit 1
          fi

  npm:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which is what lets anyone verify the
      # published tarball was built from this commit by this workflow.
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24 rather than 22 because of npm, not node: trusted publishing
          # needs npm >= 11.5.1 and node 22 still ships 10.9.8. The package
          # itself supports node >= 18 — that floor is tested by the
          # node-runtime job in ci.yml, not here.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x tsc -p tsconfig.json --noEmit
      - run: bun test src
      - run: bun run build
      # The published .d.ts as a consumer sees them, before anyone can install
      # them. The ordinary typecheck reads src/, which nobody installs.
      - run: bun run check:types

      # The dist-tag is not optional for a prerelease: npm refuses to publish
      # one without --tag at all. And the obvious way to satisfy that — passing
      # `latest` — is worse than the error, because it hands a release
      # candidate to everyone running `npm install @gsoultan/panmail-sdk`.
      # Prereleases go to `next`, where they have to be asked for by name.
      - id: disttag
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "npm will publish $version to the '$tag' tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Everything above runs either way. Only this differs.
      - name: Pack (dry run)
        if: ${{ inputs.dry_run }}
        # No provenance and no token: --dry-run resolves neither, and the point
        # here is the tarball's contents and that the manifest is publishable.
        run: npm publish --dry-run --access public --tag "${{ steps.disttag.outputs.tag }}"
      # npm rather than bun: provenance is an npm feature.
      #
      # No NODE_AUTH_TOKEN. npm authenticates this over OIDC — a "trusted
      # publisher" configured on the package pointing at this repository and
      # this workflow *filename*, release.yml. There is no long-lived token to
      # leak, rotate or leave behind in a fork.
      #
      # It is not a preference. An automation token cannot publish to an
      # account that requires 2FA for writes, and npm no longer issues granular
      # tokens with the bypass that used to make CI work. OIDC is the path.
      #
      # Bootstrapping needs one manual publish first: a trusted publisher is
      # configured in a package's settings, and a package that has never been
      # published has no settings. See CONTRIBUTING.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"

