name: Release

# One tag releases all four packages, because they share a version number.
# Go needs nothing here — the module proxy serves whatever the tag points at —
# and PHP is served by Packagist from the repository itself. Only npm and
# Maven Central need something pushed to them.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # A tag that disagrees with the manifests would publish a version nobody can
  # trace back. Cheaper to find out here than after it is on a registry, where
  # a version number cannot be reused.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          node_version="$(node -p 'require("./node/package.json").version')"
          # Parsed rather than grepped: <version> appears several times in a
          # pom and only the project's own is at the root.
          # Parsed rather than grepped: <version> appears several times in a
          # pom and only the project's own sits at the root.
          java_version="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('java/pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")"

          fail=0
          if [ "$node_version" != "$version" ]; then
            echo "::error::node/package.json is $node_version, tag is $version"
            fail=1
          fi
          if [ "$java_version" != "$version" ]; then
            echo "::error::java/pom.xml is $java_version, tag is $version"
            fail=1
          fi
          exit "$fail"

  npm:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which is what lets anyone verify the
      # published tarball was built from this commit by this workflow.
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x tsc -p tsconfig.json --noEmit
      - run: bun test src
      # npm rather than bun: provenance is an npm feature.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maven:
    needs: check-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn --batch-mode -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
