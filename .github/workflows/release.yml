name: Release

# A tag is the release. Go is served by the module proxy from the tag and PHP
# by Packagist from the repository, so there is nothing to publish and no
# credential involved. That is also why a pushed tag cannot be taken back: the
# proxy keeps a Go module version for good once it has served it.
#
# What is left to check is that the tag agrees with CHANGELOG.md, which is now
# the only place that says what a version is. This runs after the tag exists,
# so it cannot stop one; it makes a tag with no release notes loud rather than
# silent.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag has a dated CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          # "## [0.2.0] — 2026-10-01" is a release, dated the day it shipped.
          # An undated section has not happened yet, so a tag pointing at one
          # is ahead of its own notes. The dots are escaped because they are
          # regex metacharacters and 0.2.0 would otherwise also match 0x2y0.
          pattern="^## \[${version//./\\.}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}$"
          if ! grep -Eq "$pattern" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for ${version}"
            exit 1
          fi
          echo "CHANGELOG.md has a dated section for ${version}"
