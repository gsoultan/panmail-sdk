version: 2
updates:
  # The actions are the only dependency with write access to a release, so they
  # are the ones worth watching most closely.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
